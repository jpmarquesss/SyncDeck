name: Validate and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syncdeck-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate files and protocol
        run: |
          python3 scripts/validate_repository.py
          mkdir -p build/protocol-test
          javac tests/ProtocolVectorTest.java -d build/protocol-test
          java -cp build/protocol-test ProtocolVectorTest

  android:
    name: Android debug APK
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android-app/**/*.gradle
            android-app/gradle/wrapper/gradle-wrapper.properties
      - name: Test, lint and build Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug bundleRelease
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk SyncDeck-debug.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncDeck-Android-debug
          path: android-app/SyncDeck-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows agent
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build agent
        shell: cmd
        run: windows-agent\build-agent.bat
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncDeck-Windows
          path: |
            windows-agent/SyncDeckAgent.exe
            windows-agent/Compilar-e-Iniciar.bat
            windows-agent/Instalar-no-Windows.bat
            windows-agent/Configurar-Firewall.bat
            windows-agent/app.manifest
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iPhone unsigned IPA
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Validate Swift protocol implementation
        run: xcrun swift tests/ProtocolVectorTest.swift tests/protocol-vector.json
      - name: Build iPhone application without signing
        run: |
          xcodebuild \
            -project ios-app/SyncDeck.xcodeproj \
            -scheme SyncDeck \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios-app/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
      - name: Package unsigned IPA
        run: |
          APP_PATH="ios-app/build/Build/Products/Release-iphoneos/SyncDeck.app"
          test -d "$APP_PATH"
          mkdir -p ios-app/package/Payload
          cp -R "$APP_PATH" ios-app/package/Payload/SyncDeck.app
          cd ios-app/package
          /usr/bin/zip -qry ../SyncDeck-unsigned.ipa Payload
          cd ..
          shasum -a 256 SyncDeck-unsigned.ipa > SyncDeck-unsigned.ipa.sha256
      - name: Upload iPhone artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncDeck-iOS-unsigned
          path: |
            ios-app/SyncDeck-unsigned.ipa
            ios-app/SyncDeck-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish direct downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloads
      - name: Prepare public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp downloads/SyncDeck-Android-debug/SyncDeck-debug.apk dist/SyncDeck-Android.apk
          cp downloads/SyncDeck-iOS-unsigned/SyncDeck-unsigned.ipa dist/SyncDeck-iOS-unsigned.ipa
          (cd downloads/SyncDeck-Windows && zip -qr ../../dist/SyncDeck-Windows.zip .)
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "SyncDeck — versão mais recente" --latest
          else
            gh release create latest --title "SyncDeck — versão mais recente" --notes "Downloads oficiais gerados automaticamente a partir da versão mais recente validada." --latest
          fi
          gh release upload latest dist/* --clobber
