<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Símbolo do SyncDeck</title>
  <desc id="description">Quatro botões verdes arredondados sobre fundo escuro.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#102219"/>
      <stop offset="0.56" stop-color="#090e0b"/>
      <stop offset="1" stop-color="#070a09"/>
    </radialGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
