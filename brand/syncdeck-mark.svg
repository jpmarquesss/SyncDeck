    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
  <g transform="rotate(-8 512 512)" opacity=".28" filter="url(#glow)">
    <rect x="273" y="273" width="210" height="210" rx="60" fill="#72f5ad"/>
    <rect x="541" y="273" width="210" height="210" rx="60" fill="#50aa78"/>
    <rect x="273" y="541" width="210" height="210" rx="60" fill="#50aa78"/>
    <rect x="541" y="541" width="210" height="210" rx="60" fill="#72f5ad"/>
  </g>
  <g transform="rotate(-8 512 512)">
    <rect x="273" y="273" width="210" height="210" rx="60" fill="#72f5ad"/>
    <rect x="541" y="273" width="210" height="210" rx="60" fill="#50aa78"/>
    <rect x="273" y="541" width="210" height="210" rx="60" fill="#50aa78"/>
    <rect x="541" y="541" width="210" height="210" rx="60" fill="#72f5ad"/>
  </g>
